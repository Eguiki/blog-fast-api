<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualizar Post - Meu Blog</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <section class="form-container">

            <header class="form-header">
                <h1>Atualizar post</h1>
                <p>Faça as alterações que desejar na publicação.</p>
            </header>

            <form method="post">

                <div class="form-group">
                    <label for="title">Título</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ post.title }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="text">Texto</label>

                    <textarea
                        id="text"
                        name="text"
                        required
                    >{{ post.text }}</textarea>
                </div>

                <div class="form-actions">

                    <a class="back-link" href="/{{ post.id }}">
                        ← Voltar
                    </a>

                    <button type="submit">
                        Atualizar Post
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
