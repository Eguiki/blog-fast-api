<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Blog</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Meu Blog</h1>
            <p>Confira nossas publicações</p>
        </header>

        <section class="posts">

            {% for post in posts %}

                <a class="post-card" href="/{{ post.id }}">
                    <h2>{{ post.title }}</h2>
                    <span>Ver publicação →</span>
                </a>

            {% else %}

                <div class="empty">
                    <h2>Nenhum post ainda</h2>
                    <p>Seja o primeiro a criar uma publicação.</p>
                </div>

            {% endfor %}

        </section>

        <a class="new-post" href="/newpost/">
            + Adicionar novo post
        </a>

    </main>

</body>
</html>
